<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join Session</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/custom.css">
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="max-w-xl w-full p-8 bg-white rounded-lg shadow">
    <h1 class="text-2xl font-bold mb-4">Join a Session</h1>
    <form id="join-form" class="space-y-4">
      <div>
        <label class="block text-sm">Your Name</label>
        <input name="name" class="input" required />
      </div>
      <div>
        <label class="block text-sm">Session Code</label>
        <input name="code" class="input" required />
      </div>
      <div class="flex gap-2">
        <button type="submit" class="btn">Join</button>
        <a href="/" class="btn btn-outline">Back</a>
      </div>
    </form>
    <div id="msg" class="mt-4 text-sm text-red-600"></div>
  </div>
  <script>
    document.getElementById('join-form').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const form = e.target;
      const data = Object.fromEntries(new FormData(form).entries());
      const res = await fetch('/api/validate-code', {
        method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({code: data.code})
      });
      const j = await res.json();
      if (j.success) {
        const params = new URLSearchParams({code: data.code, name: data.name});
        window.location = '/speaker/view?' + params.toString();
      } else {
        document.getElementById('msg').innerText = 'Invalid code.'
      }
    });
  </script>
</body>
</html>
